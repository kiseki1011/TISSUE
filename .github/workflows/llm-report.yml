  name: LLM Report
  on:
    pull_request:
  permissions:
    contents: read
    pull-requests: write
  jobs:
    llm-report:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0 
        - uses: kiseki1011/JavaLLMReport@v0.9.0
          with:
            scan-path: .            
            fail-on: SECURITY_PROBLEM
