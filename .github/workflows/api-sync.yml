name: API Sync Check

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/api-docs.json'
      - 'client/tui/src/tissue/api/generated/**'
      - 'client/tui/scripts/regen-api.sh'
      - '.github/workflows/api-sync.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install openapi-generator
        run: |
          sudo curl -sSL \
            https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.22.0/openapi-generator-cli-7.22.0.jar \
            -o /usr/local/bin/openapi-generator.jar
          sudo tee /usr/local/bin/openapi-generator > /dev/null <<'EOF'
          #!/bin/bash
          exec java -jar /usr/local/bin/openapi-generator.jar "$@"
          EOF
          sudo chmod +x /usr/local/bin/openapi-generator
          openapi-generator version

      - name: Grant permission for gradlew
        run: chmod +x backend/gradlew

      - name: Regenerate API client
        working-directory: client/tui
        run: ./scripts/regen-api.sh

      - name: Verify in sync
        run: |
          if [ -n "$(git status --porcelain docs/api-docs.json client/tui/src/tissue/api/generated/)" ]; then
            echo "::error::API spec or generated client is out of sync"
            echo ""
            echo "The following files differ from what's committed:"
            git diff --stat docs/api-docs.json client/tui/src/tissue/api/generated/
            echo ""
            echo "Fix: run './client/tui/scripts/regen-api.sh' locally and commit the changes."
            exit 1
          fi
          echo "✓ API spec and generated client are in sync"

      - name: Slack notification on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
          if_mention: failure,cancelled
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
