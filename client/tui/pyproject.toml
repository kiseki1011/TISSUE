[project]
name = "tissue-tui"
version = "0.1.0"
description = "Tissue TUI client"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic>=2.12.5",
    "textual>=7.3.0",
    "textual-dev>=1.8.0",
    "textual-image>=0.12.0",
]

[project.scripts]
tissue = "tissue.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.15.11",
    "pre-commit>=4.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tissue"]

[tool.ruff]
line-length = 88
indent-width = 4

target-version = "py310"

src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4"   # flake8-comprehensions
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
