[project]
name = "tissue-tui"
version = "0.1.0"
description = "Tissue TUI client"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "textual>=7.3.0",
    "textual-dev>=1.8.0",
]

[project.scripts]
tissue = "tissue.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tissue"]
