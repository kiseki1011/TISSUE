[project]
name = "tissue-tui"
version = "0.1.0"
description = "TUI client for Tissue"
readme = "README.md"
authors = [
    { name = "kiseki", email = "kimseungki1011@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic>=2.13.3",
    "python-dateutil>=2.9.0.post0",
    "textual>=8.2.5",
    "textual-image>=0.12.0",
    "typing-extensions>=4.15.0",
]

[project.scripts]
tissue = "tissue.__main__:main"

[build-system]                                                                                                                                      
requires = ["hatchling"]
build-backend = "hatchling.build"                                                                                                                                         
                                                                                                                                                                          
[tool.hatch.build.targets.wheel]                                                                                                                    
packages = ["src/tissue"]      

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "ruff>=0.15.12",
    "textual-dev>=1.8.0",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"
src = ["src"]
extend-exclude = ["src/tissue/api/generated"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4"   # flake8-comprehensions
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src"]
exclude = ["src/tissue/api/generated"]
typeCheckingMode = "basic"
pythonVersion = "3.14"
