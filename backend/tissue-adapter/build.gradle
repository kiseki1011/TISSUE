project(':tissue-adapter') {
  dependencies {
    implementation project(':tissue-core')
    implementation project(':tissue-security')

    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.oauth2.client
    implementation libs.spring.boot.starter.oauth2.resource.server

    implementation libs.spring.boot.starter.data.redis
    // Bundled with the redis starter so operators can enable lettuce pooling
    // (spring.data.redis.lettuce.pool.enabled=true) without adding a dependency.
    implementation libs.commons.pool2
    implementation libs.spring.boot.starter.cache
    implementation libs.caffeine

    implementation libs.spring.boot.starter.mail
    implementation libs.spring.boot.starter.thymeleaf
    implementation libs.spring.retry

    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    implementation libs.micrometer.tracing.bridge.brave

    implementation libs.aws.sdk.s3

    runtimeOnly libs.postgresql

    testImplementation libs.spring.boot.testcontainers
    testImplementation libs.testcontainers.postgresql
  }

  bootJar.enabled = false
  jar.enabled = true
}
