# Event Notifications (Korean)
event.ISSUE_CREATED.title=[{workspaceKey}:{issueKey}] 이슈 생성됨
event.ISSUE_CREATED.content={actorName}님이 프로젝트 {projectKey}에 새 이슈 {issueKey}를 생성했습니다.

event.ISSUE_ASSIGNED.title=[{workspaceKey}:{issueKey}] 이슈 할당됨
event.ISSUE_ASSIGNED.content={actorName}님이 이슈 {issueKey}를 귀하에게 할당했습니다.

event.ISSUE_UNASSIGNED.title=[{workspaceKey}:{issueKey}] 이슈 할당 해제됨
event.ISSUE_UNASSIGNED.content={actorName}님이 귀하를 이슈 {issueKey} 담당자에서 해제했습니다.

event.ISSUE_UPDATED.title=[{workspaceKey}:{issueKey}] 이슈 수정됨
event.ISSUE_UPDATED.content={actorName}님이 이슈 {issueKey}를 수정했습니다. 변경된 항목: {changedFields}.

event.ISSUE_STATUS_CHANGED.title=[{workspaceKey}:{issueKey}] 상태 변경됨
event.ISSUE_STATUS_CHANGED.content={actorName}님이 이슈 {issueKey}의 상태를 {oldStatus}에서 {newStatus}로 변경했습니다.

event.ISSUE_REPORTER_CHANGED.title=[{workspaceKey}:{issueKey}] 보고자 변경됨
event.ISSUE_REPORTER_CHANGED.content={actorName}님이 이슈 {issueKey}의 보고자를 변경했습니다.

event.ISSUE_REVIEWER_ADDED.title=[{workspaceKey}:{issueKey}] 리뷰어 지정됨
event.ISSUE_REVIEWER_ADDED.content={actorName}님이 귀하를 이슈 {issueKey}의 리뷰어로 지정했습니다.

event.ISSUE_REVIEWER_REMOVED.title=[{workspaceKey}:{issueKey}] 리뷰어 해제됨
event.ISSUE_REVIEWER_REMOVED.content={actorName}님이 {removedReviewerName}님을 이슈 {issueKey}의 리뷰어에서 제외했습니다.

event.ISSUE_REVIEW_REQUESTED.title=[{workspaceKey}:{issueKey}] 리뷰 요청됨
event.ISSUE_REVIEW_REQUESTED.content={actorName}님이 이슈 {issueKey}에 대한 리뷰를 요청했습니다.

event.ISSUE_REVIEW_SUBMITTED.title=[{workspaceKey}:{issueKey}] 리뷰 제출됨
event.ISSUE_REVIEW_SUBMITTED.content={actorName}님이 이슈 {issueKey}에 대한 리뷰를 제출했습니다. 결과: {status}.

event.ISSUE_DELETED.title=[{workspaceKey}:{issueKey}] 이슈 삭제됨
event.ISSUE_DELETED.content={actorName}님이 이슈 {issueKey}를 삭제했습니다.

event.ISSUE_COMMENT_ADDED.title=[{workspaceKey}:{issueKey}] 새 댓글 등록됨
event.ISSUE_COMMENT_ADDED.content={actorName}님이 이슈 {issueKey}에 댓글을 남겼습니다.

event.SPRINT_STARTED.title=[{workspaceKey}] 스프린트 시작됨: {sprintName}
event.SPRINT_STARTED.content=스프린트 {sprintName}가 시작되었습니다.

event.SPRINT_COMPLETED.title=[{workspaceKey}] 스프린트 완료됨: {sprintName}
event.SPRINT_COMPLETED.content=스프린트 {sprintName}가 완료되었습니다. ({startedAt} ~ {endedAt})

event.MEMBER_JOINED_WORKSPACE.title=[{workspaceKey}] 새 멤버 가입
event.MEMBER_JOINED_WORKSPACE.content={memberName}님이 워크스페이스 {workspaceKey}에 {role} 권한으로 합류했습니다.

event.MEMBER_JOINED_PROJECT.title=[{projectKey}] 새 멤버 가입
event.MEMBER_JOINED_PROJECT.content={memberName}님이 프로젝트 {projectKey}에 {role} 권한으로 합류했습니다.

event.WORKSPACE_ROLE_CHANGED.title=[{workspaceKey}] 권한 변경됨
event.WORKSPACE_ROLE_CHANGED.content={actorName}님이 워크스페이스 {workspaceKey}에서 {memberName}님의 권한을 {oldRole}에서 {newRole}로 변경했습니다.

event.PROJECT_ROLE_CHANGED.title=[{projectKey}] 권한 변경됨
event.PROJECT_ROLE_CHANGED.content={actorName}님이 프로젝트 {projectKey}에서 {memberName}님의 권한을 {oldRole}에서 {newRole}로 변경했습니다.

# Common Validations
valid.notnull=필수 입력 항목입니다.
