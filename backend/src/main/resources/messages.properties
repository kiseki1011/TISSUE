// @formatter:off

# Args: {0}=Project/WorkspaceKey, {1}=IssueKey/ResourceName, {2}=ActorName, {3}=Extra1, {4}=Extra2
event.ISSUE_CREATED.title=[{0}/{1}] Created issue
event.ISSUE_CREATED.content={2} has created issue {1}

event.ISSUE_UPDATED.title=[{0}/{1}] Updated issue
event.ISSUE_UPDATED.content={2} has updated issue {1}

event.ISSUE_STATUS_CHANGED.title=[{0}/{1}] Issue status changed
event.ISSUE_STATUS_CHANGED.content={2} has changed issue "{1}" status: {3} \u2192 {4}

event.ISSUE_PARENT_ASSIGNED.title=[{0}/{1}] Issue parent assigned
event.ISSUE_PARENT_ASSIGNED.content={2} has assigned issue "{3}" as parent of "{1}"

event.ISSUE_PARENT_REMOVED.title=[{0}/{1}] Issue parent removed
event.ISSUE_PARENT_REMOVED.content={2} has removed parent issue "{3}" from issue "{1}"

event.ISSUE_ASSIGNED.title=[{0}/{1}] Issue assigned
event.ISSUE_ASSIGNED.content={2} has assigned {3} to issue "{1}"

event.ISSUE_UNASSIGNED.title=[{0}/{1}] Issue unassigned
event.ISSUE_UNASSIGNED.content={2} has unassigned {3} from issue "{1}"

event.ISSUE_REVIEWER_ADDED.title=[{0}/{1}] Added as reviewer of issue
event.ISSUE_REVIEWER_ADDED.content={2} has added {3} as reviewer for issue "{1}"

event.ISSUE_COMMENT_ADDED.title=[{0}/{1}] Issue comment added
event.ISSUE_COMMENT_ADDED.content={2} has added comment to issue "{1}"

event.ISSUE_REVIEW_REQUESTED.title=[{0}/{1}] Review requested
event.ISSUE_REVIEW_REQUESTED.content={2} has requested review for issue "{1}"

event.ISSUE_REVIEW_SUBMITTED.title=[{0}/{1}] Review submitted
event.ISSUE_REVIEW_SUBMITTED.content={2} has submitted review for issue "{1}", review status: {3}

# Args: {0}=WorkspaceKey, {1}=SprintName
event.SPRINT_STARTED.title=[{0}/{1}] Sprint started
event.SPRINT_STARTED.content=Sprint "{1}" has started

event.SPRINT_COMPLETED.title=[{0}/{1}] Sprint ended
event.SPRINT_COMPLETED.content=Sprint "{1}" has ended (period: {2} ~ {3})

# Args: {0}=WorkspaceKey, {1}=MemberName, {2}=Role/Extra
event.MEMBER_JOINED_WORKSPACE.title=[{0}] New member joined
event.MEMBER_JOINED_WORKSPACE.content={1} has joined workspace as a {2}

event.WORKSPACE_MEMBER_ROLE_CHANGED.title=[{0}] Role changed
event.WORKSPACE_MEMBER_ROLE_CHANGED.content={2} has changed {1}'s role from {3} to {4}
