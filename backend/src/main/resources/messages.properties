# Event Notifications (English)
event.ISSUE_CREATED.title=[([(${workspaceKey})]:[(${issueKey})])] Issue Created
event.ISSUE_CREATED.content=[(${actorName})] created a new issue [(${issueKey})] in project [(${projectKey})].

event.ISSUE_ASSIGNED.title=[([(${workspaceKey})]:[(${issueKey})])] Issue Assigned
event.ISSUE_ASSIGNED.content=[(${actorName})] assigned issue [(${issueKey})] to you.

event.ISSUE_UNASSIGNED.title=[([(${workspaceKey})]:[(${issueKey})])] Issue Unassigned
event.ISSUE_UNASSIGNED.content=[(${actorName})] unassigned you from issue [(${issueKey})].

event.ISSUE_UPDATED.title=[([(${workspaceKey})]:[(${issueKey})])] Issue Updated
event.ISSUE_UPDATED.content=[(${actorName})] updated issue [(${issueKey})]. Changed fields: [(${changedFields})].

event.ISSUE_STATUS_CHANGED.title=[([(${workspaceKey})]:[(${issueKey})])] Status Changed
event.ISSUE_STATUS_CHANGED.content=[(${actorName})] changed status of [(${issueKey})] from [(${oldState})] to [(${newState})].

event.ISSUE_REPORTER_CHANGED.title=[([(${workspaceKey})]:[(${issueKey})])] Reporter Changed
event.ISSUE_REPORTER_CHANGED.content=[(${actorName})] changed the reporter of [(${issueKey})].

event.ISSUE_REVIEWER_ADDED.title=[([(${workspaceKey})]:[(${issueKey})])] Reviewer Added
event.ISSUE_REVIEWER_ADDED.content=[(${actorName})] added you as a reviewer for issue [(${issueKey})].

event.ISSUE_REVIEWER_REMOVED.title=[([(${workspaceKey})]:[(${issueKey})])] Reviewer Removed
event.ISSUE_REVIEWER_REMOVED.content=[(${actorName})] removed [(${removedReviewerName})] from reviewers of issue [(${issueKey})].

event.ISSUE_REVIEW_REQUESTED.title=[([(${workspaceKey})]:[(${issueKey})])] Review Requested
event.ISSUE_REVIEW_REQUESTED.content=[(${actorName})] requested a review for issue [(${issueKey})].

event.ISSUE_REVIEW_SUBMITTED.title=[([(${workspaceKey})]:[(${issueKey})])] Review Submitted
event.ISSUE_REVIEW_SUBMITTED.content=[(${actorName})] submitted a review for issue [(${issueKey})]. Result: [(${status})].

event.ISSUE_DELETED.title=[([(${workspaceKey})]:[(${issueKey})])] Issue Deleted
event.ISSUE_DELETED.content=[(${actorName})] deleted issue [(${issueKey})].

event.ISSUE_COMMENT_ADDED.title=[([(${workspaceKey})]:[(${issueKey})])] New Comment Added
event.ISSUE_COMMENT_ADDED.content=[(${actorName})] commented on issue [(${issueKey})].

event.ISSUE_MENTIONED.title=[([(${workspaceKey})]:[(${issueKey})])] You were mentioned
event.ISSUE_MENTIONED.content=[(${actorName})] mentioned you in a comment on issue [(${issueKey})].

event.SPRINT_STARTED.title=[([(${workspaceKey})])] Sprint Started: [(${sprintTitle})]
event.SPRINT_STARTED.content=Sprint [(${sprintTitle})] has been started.

event.SPRINT_COMPLETED.title=[([(${workspaceKey})])] Sprint Completed: [(${sprintTitle})]
event.SPRINT_COMPLETED.content=Sprint [(${sprintTitle})] has been completed. ([(${startedAt})] ~ [(${endedAt})])

event.MEMBER_JOINED_WORKSPACE.title=[([(${workspaceKey})])] New Member Joined
event.MEMBER_JOINED_WORKSPACE.content=[(${joinedMemberName})] joined workspace [(${workspaceKey})] as [(${role})].

event.MEMBER_JOINED_PROJECT.title=[([(${projectKey})])] New Member Joined
event.MEMBER_JOINED_PROJECT.content=[(${joinedMemberName})] joined project [(${projectKey})] as [(${role})].

event.WORKSPACE_ROLE_CHANGED.title=[([(${workspaceKey})])] Role Changed
event.WORKSPACE_ROLE_CHANGED.content=[(${actorName})] changed [(${targetName})]'s role in [(${workspaceKey})] from [(${oldRole})] to [(${newRole})].

event.PROJECT_ROLE_CHANGED.title=[([(${projectKey})])] Role Changed
event.PROJECT_ROLE_CHANGED.content=[(${actorName})] changed [(${targetName})]'s role in [(${projectKey})] from [(${oldRole})] to [(${newRole})].
