spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

  mail:
    host: "disabled"
    port: 587

  messages:
    cache-duration: -1

server:
  forward-headers-strategy: native

management:
  server:
    port: 8081
    address: 0.0.0.0
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

tissue:
  security:
    email-required: false
    oauth2:
      allowed-redirect-origins: "*"
    signup:
      enabled: true
      allowed-domains: "*"
    cors:
      allowed-origins: "*"
    cookie:
      secure: false

springdoc:
  api-docs:
    enabled: false

logging:
  level:
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: off
    org.hibernate.orm.jdbc.bind: off
    org.hibernate.stat: off
