spring:
  datasource:
    url: ${POSTGRESQL_ENDPOINT_URL}
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

  mail:
    host: "disabled"
    port: 587

  messages:
    cache-duration: -1

server:
  forward-headers-strategy: native

management:
  server:
    port: 8081
    address: 0.0.0.0
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

tissue:
  base-url: ${TISSUE_BASE_URL:http://localhost:8080}

  security:
    email-required: false
    oauth2:
      allowed-redirect-origins: "*"
    signup:
      enabled: true
      allowed-domains: "*"
    cors:
      allowed-origins: "*"
    jwt:
      secret: ${JWT_SECRET}
    cookie:
      secure: false

  storage:
    storage-type: local
    storage-path: ${TISSUE_LOCAL_STORAGE_PATH:/var/tissue/storage}

springdoc:
  api-docs:
    enabled: false

logging:
  level:
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: off
    org.hibernate.orm.jdbc.bind: off
    org.hibernate.stat: off
