# Default
spring:
  profiles:
    active: local

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user
  jpa:
    hibernate:
      ddl-auto: create
    properties.hibernate:
      format_sql: true
      show-sql: true
      highlight_sql: true
      default_batch_fetch_size: 100

server:
  forward-headers-strategy: native

management:
  tracing:
    sampling:
      probability: 1.0

tissue:
  base-url: http://localhost:8080

  system:
    server-name: "Tissue Official Server"

  security:
    auth-providers: # auth-providers -> oidc-providers
      - EMAIL
      - GOOGLE
      - GITHUB
    signup:
      allow-signup: true # allow-signup -> allow
      allowed-domains: []
    jwt:
      secret: ${JWT_SECRET:very_secret_key_that_is_at_least_32_chars_long_123}
      access-token-validity: 3600
      refresh-token-validity: 604800
      elevated-token-validity: 600

  cache:
    type: caffeine # options: caffeine (default) / redis

  email:
    sender: ${TISSUE_EMAIL_SENDER:noreply@tissue.com}
    provider: google # options: google / amazon_ses / in_application
    verification:
      # token-store -> token.store , put signup-ttl, password-reset-ttl under token
      token-store: redis  # options: redis / rdb
      verification-email-ttl: 1800s
      signup-token-ttl: 600s
      password-reset-token-ttl: 300s
      base-url: ${tissue.base-url}

  notification:
    email:
      concurrency: 20
      retry-interval-ms: 180000
    executor:
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 100
      thread-name-prefix: Notification-

  member:
    policy:
      max-owned-workspaces: 10
      max-joined-workspaces: 10

  workspace:
    policy:
      max-members: 1000

  project:
    policy:
      max-members: 1000

  issue:
    policy:
      max-reviewers: 10
      max-subscribers: 100

      field:
        max-select-options: 100
        decimal:
          scale: 6
          rounding: HALF_UP
          digits:
            integer: 14
            fraction: 6

    # move it under issue.relation? or maybe just remove it
    circular-dependency-cache:
      size: 1000
      duration: 1

logging:
  level:
    org.hibernate:
      SQL: DEBUG
      orm.jdbc.bind: TRACE

---
# Local
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/tissue_local
    username: developer
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${LOCAL_REDIS_PASSWORD:}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:missing_username}
    password: ${GMAIL_PASSWORD:missing_password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

---
# Production
spring:
  config:
    activate:
      on-profile: prod

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user

  datasource:
    url: ${POSTGRESQL_ENDPOINT_URL}
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password: ${LOCAL_REDIS_PASSWORD:}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:missing_username}
    password: ${GMAIL_PASSWORD:missing_password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  messages:
    cache-duration: -1

logging:
  level:
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: off
    org.hibernate.orm.jdbc.bind: off
    org.hibernate.stat: off
