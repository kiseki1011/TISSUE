spring:
  profiles:
    active: local

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  threads:
    virtual:
      enabled: true

  jpa:
    properties.hibernate:
      default_batch_fetch_size: 100

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user

server:
  forward-headers-strategy: native

management:
  tracing:
    sampling:
      probability: 1.0

tissue:
  base-url: http://localhost:8080

  vcs:
    base-url: ${tissue.base-url}

  system:
    server-name: "Tissue Official Server"

  security:
    auth-providers:
      - EMAIL
      - GOOGLE
      - GITHUB
    signup:
      enabled: true
      allowed-domains: # empty = all domains allowed
      # example:
      # - google.com
    jwt:
      secret: ${JWT_SECRET:very_secret_key_that_is_at_least_32_chars_long_123}
      access-token-validity: 3600
      refresh-token-validity: 604800
      elevated-token-validity: 600
    refresh-token:
      store: rdb # options: rdb (default) / redis

  cache:
    type: caffeine # options: caffeine (default) / redis

  email:
    sender: ${TISSUE_EMAIL_SENDER:noreply@tissue.com}
    provider: smtp # options: dummy (default) / smtp
    verification:
      email-ttl: 1800s
      base-url: ${tissue.base-url}
      token:
        store: rdb # options: rdb (default) / redis
        signup-ttl: 600s
        password-reset-ttl: 300s

  notification:
    email:
      concurrency: 20
      retry-interval-ms: 180000

  member:
    policy:
      max-owned-workspaces: 10
      max-joined-workspaces: 10

  workspace:
    policy:
      max-members: 1000
      max-projects: 100

  project:
    policy:
      max-members: 1000

  issue:
    policy:
      max-reviewers: 10
      max-subscribers: 100

      field:
        max-select-options: 100
        decimal:
          scale: 6
          rounding: HALF_UP
          digits:
            integer: 14
            fraction: 6
