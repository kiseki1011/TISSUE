spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tissue}
    username: ${POSTGRES_USERNAME:tissue}
    password: ${POSTGRES_PASSWORD:tissue}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 600000              # 10 min
      max-lifetime: 1800000             # 30 min
      connection-timeout: 30000         # 30s
      validation-timeout: 5000          # 5s
      leak-detection-threshold: 60000   # 1 min

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1s
      connect-timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
    web:
      pageable:
        max-page-size: 100

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        type:
          preferred_instant_jdbc_type: TIMESTAMP_WITH_TIMEZONE
        create_empty_composites:
          enabled: true
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
          plan_cache_max_size: 4096
          plan_parameter_metadata_max_size: 256

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
      indent-output: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # Exposes Tissue MCP tools to AI agents over HTTP.
  #   protocol:       STREAMABLE (default) | STDIO | SSE | STATELESS
  #   mcp-endpoint:   path agents connect to; requests authenticate with a Personal Access Token (PAT).
  #
  # See https://docs.spring.io/spring-ai/reference/api/mcp/mcp-streamable-http-server-boot-starter-docs.html
  # for more detail.
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: tissue-mcp
        version: ${tissue.system.version}
        streamable-http:
          mcp-endpoint: /mcp/v1

server:
  forward-headers-strategy: none
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: 10
    max-connections: 8192
    accept-count: 100
    connection-timeout: 20s
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: ${USE_REDIS:false}
  metrics:
    tags:
      application: tissue
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      slo:
        http.server.requests: 100ms,300ms,1s
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

tissue:
  system:
    version: "@tissueVersion@"
    server-name: "Tissue Server"

  base-url: ${TISSUE_BASE_URL:http://localhost:8080}

  # Self-service signup. The initial user can always sign up (initial admin bootstrap) even when closed.
  #   TISSUE_SIGNUP_ENABLED:  true | false
  #     true:                 anyone may register an account.
  #     false (default):      registration is closed, members can join by invite / OIDC only.
  security:
    signup:
      enabled: ${TISSUE_SIGNUP_ENABLED:false}
    jwt:
      secret: ${JWT_SECRET:}
      access-token-validity: 1h
      refresh-token-validity: 14d
    rate-limit:
      login:
        max-attempts: 10
        window: 30m
      email-verification:
        max-attempts: 5
        window: 1h
      password-reset:
        max-attempts: 5
        window: 1h

  # Authentication mode for this instance.
  #   mode: LOCAL | OIDC
  #     LOCAL (default): Tissue's own username/email + password login
  #     OIDC:            Login through an external IdP
  #
  # Identity provider (IdP) name.
  #   provider-name:    keycloak | okta | auth0 | github | gitlab | google | etc.
  #
  # Claim names the IdP uses (defaults match the OIDC standard claims). Change if needed.
  #   username-claim:   preferred_username
  #   email-claim:      email
  #   name-claim:       name
  #
  # Comma separated allow-list of email domains. Empty means any domain may be provisioned.
  #   allowed-email-domains:
  #
  # JIT provisioning on first successful OIDC login. Use true, unless a custom signup flow is implemented.
  #   auto-provision:   true
  auth:
    mode: ${TISSUE_AUTH_MODE:LOCAL}
    oidc:
      issuer-uri: ${TISSUE_AUTH_OIDC_ISSUER_URI:}
      client-id: ${TISSUE_AUTH_OIDC_CLIENT_ID:}
      provider-name: ${TISSUE_AUTH_OIDC_PROVIDER_NAME:}
      client-secret: ${TISSUE_AUTH_OIDC_CLIENT_SECRET:}
      username-claim: ${TISSUE_AUTH_OIDC_USERNAME_CLAIM:preferred_username}
      email-claim: ${TISSUE_AUTH_OIDC_EMAIL_CLAIM:email}
      name-claim: ${TISSUE_AUTH_OIDC_NAME_CLAIM:name}
      allowed-email-domains: ${TISSUE_AUTH_OIDC_ALLOWED_EMAIL_DOMAINS:}
      auto-provision: ${TISSUE_AUTH_OIDC_AUTO_PROVISION:true}

  # Redis toggle.
  #   false (default):   Caffeine cache (single instance, no extra infra).
  #   true:              Redis (configure spring.data.redis.*). Also enables Redis health check.
  use-redis: ${USE_REDIS:false}

  # Outbound email.
  #   client:             smtp | dummy
  #     smtp (default):   send through spring.mail.* (real SMTP, uses Mailpit in local dev).
  #     dummy:            log instead of sending (used by tests).
  #
  # Verification related TTL (for verification.*)
  #   email-ttl:          TTL for the signup email link
  #   verified-token-ttl: TTL for the short-lived verified token
  email:
    client: smtp
    sender: ${TISSUE_EMAIL_SENDER:noreply@trytissue.dev}
    verification:
      email-ttl: 1800s
      verified-token-ttl: 10m

  notification:
    email:
      concurrency: 20
      retry-interval: 3m

  # Realtime updates over Server-Sent Events (SSE).
  #   sse.timeout-ms:   how long a single stream stays open before the client must reconnect
  #   sse.heartbeat-ms: interval between keep-alive pings that hold idle connections open and
  #                     prune dead ones
  realtime:
    sse:
      timeout-ms: ${TISSUE_REALTIME_SSE_TIMEOUT_MS:1800000}   # 30 min
      heartbeat-ms: ${TISSUE_REALTIME_SSE_HEARTBEAT_MS:15000} # 15s

  # Member policy
  #
  # The retention period for storing the withdrawn member's PII, before permanent deletion.
  #   deletion.retention:    7d
  #
  # PII wipeout schedule using cron.
  #   deletion.cleanup-cron: "0 0 3 * * *"
  member:
    deletion:
      retention: 7d
      cleanup-cron: "0 0 3 * * *"

  project:
    policy:
      max-members: 1000

  storage:
    storage-type: ${TISSUE_STORAGE_TYPE:local} # local | s3
    storage-path: ${TISSUE_LOCAL_STORAGE_PATH:./tissue-storage}

  issue:
    attachment:
      max-file-size: 20971520 # 20MB
      max-attachments-per-issue: 20
    policy:
      max-reviewers: 10
      max-subscribers: 100

      field:
        max-select-options: 100
        decimal:
          scale: 6
          rounding: HALF_UP
          digits:
            integer: 14
            fraction: 6
