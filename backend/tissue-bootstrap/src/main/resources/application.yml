spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    properties.hibernate:
      default_batch_fetch_size: 100
      create_empty_composites.enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  # Uncomment to enable OAuth2 login (requires setting env vars)
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID}
  #           client-secret: ${GOOGLE_CLIENT_SECRET}
  #           scope:
  #             - email
  #             - profile
  #         github:
  #           client-id: ${GITHUB_CLIENT_ID}
  #           client-secret: ${GITHUB_CLIENT_SECRET}
  #           scope:
  #             - user:email
  #             - read:user

server:
  forward-headers-strategy: native

management:
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    display-request-duration: true
    doc-expansion: list
    default-models-expand-depth: -1
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

tissue:
  base-url: http://localhost:8080

  vcs:
    base-url: ${TISSUE_VCS_BASE_URL:${tissue.base-url}}

  system:
    server-name: "Tissue Server"

  security:
    # Will use username to signup, and disable all email related functionality when 'false'
    email-required: true
    signup:
      enabled: true
      allowed-domains: # empty = all domains allowed
      # example:
      # - google.com
    jwt:
      secret: ${JWT_SECRET:very_secret_key_that_is_at_least_32_chars_long_123}
      access-token-validity: 1h
      refresh-token-validity: 7d
      elevated-token-validity: 10m
    cookie:
      secure: false # Set as 'true' if using HTTPS
    rate-limit:
      login:
        max-attempts: 10
        window: 30m
      email-verification:
        max-attempts: 5
        window: 1h
      password-reset:
        max-attempts: 5
        window: 1h

  use-redis: false

  email:
    client: dummy # dummy | smtp
    sender: ${TISSUE_EMAIL_SENDER:noreply@tissue.com}
    verification:
      email-ttl: 1800s
      base-url: ${TISSUE_EMAIL_VERIFICATION_BASE_URL:${tissue.base-url}}
      token:
        signup-ttl: 600s
        password-reset-ttl: 300s

  notification:
    email:
      concurrency: 20
      retry-interval: 3m

  member:
    policy:
      max-owned-workspaces: 10
      max-joined-workspaces: 10

  workspace:
    policy:
      max-members: 1000
      max-projects: 100

  project:
    policy:
      max-members: 1000

  attachment:
    storage-type: local # local | s3
    storage-path: ./tissue-storage
    max-file-size: 20971520 # 20MB
    max-attachments-per-issue: 20
    # s3:
    #   endpoint: ${TISSUE_S3_ENDPOINT:}
    #   region: ${TISSUE_S3_REGION:}
    #   bucket: ${TISSUE_S3_BUCKET:}
    #   access-key: ${TISSUE_S3_ACCESS_KEY:}
    #   secret-key: ${TISSUE_S3_SECRET_KEY:}

  issue:
    policy:
      max-reviewers: 10
      max-subscribers: 100

      field:
        max-select-options: 100
        decimal:
          scale: 6
          rounding: HALF_UP
          digits:
            integer: 14
            fraction: 6
