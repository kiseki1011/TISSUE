spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    properties.hibernate:
      default_batch_fetch_size: 100
      create_empty_composites.enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  forward-headers-strategy: none

management:
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

tissue:
  system:
    version: "0.7.0"
    server-name: "Tissue Server"

  deployment:
    multi-tenant: ${TISSUE_MULTI_TENANT:false}

  security:
    jwt:
      access-token-validity: 2h
      refresh-token-validity: 14d
      elevated-token-validity: 10m
    rate-limit:
      login:
        max-attempts: 10
        window: 30m
      email-verification:
        max-attempts: 5
        window: 1h
      password-reset:
        max-attempts: 5
        window: 1h

  use-redis: true

  email:
    client: smtp
    sender: ${TISSUE_EMAIL_SENDER:noreply@trytissue.dev}
    verification:
      email-ttl: 1800s
      verified-token-ttl: 10m

  notification:
    email:
      concurrency: 20
      retry-interval: 3m

  member:
    policy:
      max-owned-workspaces: 10
      max-joined-workspaces: 10
    deletion:
      # How long a withdrawn (status=DELETED) member is kept before PII is wiped
      retention: 7d
      # Anonymization sweep schedule
      cleanup-cron: "0 0 3 * * *"

  workspace:
    policy:
      max-members: 1000
      max-projects: 100

  project:
    policy:
      max-members: 1000

  storage:
    storage-type: local # local | s3
    storage-path: ./tissue-storage

  issue:
    attachment:
      max-file-size: 20971520 # 20MB
      max-attachments-per-issue: 20
    policy:
      max-reviewers: 10
      max-subscribers: 100

      field:
        max-select-options: 100
        decimal:
          scale: 6
          rounding: HALF_UP
          digits:
            integer: 14
            fraction: 6
