spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tissue}
    username: ${POSTGRES_USERNAME:tissue}
    password: ${POSTGRES_PASSWORD:tissue}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 600000          # 10 min
      max-lifetime: 1800000         # 30 min
      connection-timeout: 30000     # 30s
      validation-timeout: 5000
      leak-detection-threshold: 60000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1s
      connect-timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        create_empty_composites:
          enabled: true
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
          plan_cache_max_size: 4096
          plan_parameter_metadata_max_size: 256

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
      indent-output: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  forward-headers-strategy: none
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: 10
    max-connections: 8192
    accept-count: 100
    connection-timeout: 20s
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: ${USE_REDIS:false}
  metrics:
    tags:
      application: tissue
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      slo:
        http.server.requests: 100ms,300ms,1s
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

tissue:
  system:
    version: "0.7.0"
    server-name: "Tissue Server"

  deployment:
    multi-tenant: ${TISSUE_MULTI_TENANT:false}

  base-url: ${TISSUE_BASE_URL:http://localhost:8080}

  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-validity: 2h
      refresh-token-validity: 14d
      elevated-token-validity: 10m
    rate-limit:
      login:
        max-attempts: 10
        window: 30m
      email-verification:
        max-attempts: 5
        window: 1h
      password-reset:
        max-attempts: 5
        window: 1h

  use-redis: ${USE_REDIS:false}

  email:
    client: smtp
    sender: ${TISSUE_EMAIL_SENDER:noreply@trytissue.dev}
    verification:
      email-ttl: 1800s
      verified-token-ttl: 10m

  notification:
    email:
      concurrency: 20
      retry-interval: 3m

  member:
    policy:
      max-owned-workspaces: 10
      max-joined-workspaces: 10
    deletion:
      # How long a withdrawn (status=DELETED) member is kept before PII is wiped
      retention: 7d
      # PII wipeout schedule
      cleanup-cron: "0 0 3 * * *"

  workspace:
    policy:
      max-members: 1000
      max-projects: 100

  project:
    policy:
      max-members: 1000

  storage:
    storage-type: ${TISSUE_STORAGE_TYPE:local} # local | s3
    storage-path: ${TISSUE_LOCAL_STORAGE_PATH:./tissue-storage}

  issue:
    attachment:
      max-file-size: 20971520 # 20MB
      max-attachments-per-issue: 20
    policy:
      max-reviewers: 10
      max-subscribers: 100

      field:
        max-select-options: 100
        decimal:
          scale: 6
          rounding: HALF_UP
          digits:
            integer: 14
            fraction: 6
