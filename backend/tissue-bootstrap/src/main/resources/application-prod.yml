spring:
  datasource:
    url: ${POSTGRESQL_ENDPOINT_URL}
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  mail:
    host: ${MAIL_SMTP_HOST:}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  messages:
    cache-duration: -1

tissue:
  base-url: ${TISSUE_BASE_URL}

  security:
    jwt:
      secret: ${JWT_SECRET}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    oauth2:
      allowed-redirect-origins: ${OAUTH2_ALLOWED_REDIRECT_ORIGINS:}

  attachment:
    storage-type: local # local | s3
    storage-path: ./tissue-storage
    # s3:
    #   endpoint: ${TISSUE_S3_ENDPOINT:}
    #   region: ${TISSUE_S3_REGION:}
    #   bucket: ${TISSUE_S3_BUCKET:}
    #   access-key: ${TISSUE_S3_ACCESS_KEY:}
    #   secret-key: ${TISSUE_S3_SECRET_KEY:}

springdoc:
  api-docs:
    enabled: false

logging:
  level:
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: off
    org.hibernate.orm.jdbc.bind: off
    org.hibernate.stat: off
