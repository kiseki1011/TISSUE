spring:
  datasource:
    url: ${POSTGRESQL_ENDPOINT_URL}
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

  mail:
    host: ${MAIL_SMTP_HOST}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  messages:
    cache-duration: -1

  # Uncomment to enable OAuth2 login
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID}
  #           client-secret: ${GOOGLE_CLIENT_SECRET}
  #           scope:
  #             - email
  #             - profile
  #         github:
  #           client-id: ${GITHUB_CLIENT_ID}
  #           client-secret: ${GITHUB_CLIENT_SECRET}
  #           scope:
  #             - user:email
  #             - read:user

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXY_IP:}

management:
  server:
    port: 8081
    address: 0.0.0.0
  endpoint:
    health:
      show-details: never

tissue:
  base-url: ${TISSUE_BASE_URL}

  security:
    email-required: true
    oauth2:
      allowed-redirect-origins: ${OAUTH2_ALLOWED_REDIRECT_ORIGINS}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    jwt:
      secret: ${JWT_SECRET}
    cookie:
      secure: true

  storage:
    storage-type: local # local | s3
    storage-path: ${TISSUE_LOCAL_STORAGE_PATH:./tissue-storage}
    # s3:
    #   endpoint: ${TISSUE_S3_ENDPOINT:}
    #   region: ${TISSUE_S3_REGION:}
    #   bucket: ${TISSUE_S3_BUCKET:}
    #   access-key: ${TISSUE_S3_ACCESS_KEY:}
    #   secret-key: ${TISSUE_S3_SECRET_KEY:}

springdoc:
  api-docs:
    enabled: false

logging:
  level:
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: off
    org.hibernate.orm.jdbc.bind: off
    org.hibernate.stat: off
