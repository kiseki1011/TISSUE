spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tissue_local
    username: developer
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show-sql: true
        highlight_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${LOCAL_REDIS_PASSWORD:}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:missing_username}
    password: ${GMAIL_PASSWORD:missing_password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

logging:
  level:
    org.hibernate:
      SQL: DEBUG
      orm.jdbc.bind: TRACE
