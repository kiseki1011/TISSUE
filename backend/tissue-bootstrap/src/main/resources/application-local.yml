spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tissue_local
    username: developer
    password: password
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show-sql: true
        highlight_sql: true

  # for mailpit
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

tissue:
  base-url: http://localhost:8080

  security:
    email-required: true
    oauth2:
      allowed-redirect-origins: ["*"]
    signup:
      enabled: true
      allowed-domains: ["*"]
    cors:
      allowed-origins: ["*"]
    jwt:
      secret: "PLACEHOLDER_SECRET_THAT_IS_OVER_32_BYTES"
    cookie:
      secure: false

logging:
  level:
    org.hibernate:
      SQL: DEBUG
      orm.jdbc.bind: TRACE
