spring:
  # Load a .env (KEY=value) for local overrides, if present
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/tissue_local
    username: developer
    password: password

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show-sql: true
        highlight_sql: true

  devtools:
    restart:
      enabled: false

  # mailpit
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

tissue:
  security:
    email-required: true
    cors:
      allowed-origins: ["*"]
    jwt:
      secret: "local-dev-secret-not-for-production-at-least-32-bytes-long"
    cookie:
      secure: false

logging:
  level:
    org.hibernate:
      SQL: DEBUG
      orm.jdbc.bind: TRACE
