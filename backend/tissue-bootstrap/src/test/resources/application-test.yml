spring:
  jpa:
    hibernate:
      ddl-auto: create

tissue:
  test:
    db:
      image: "postgres:16-alpine"
    redis:
      image: "redis:7.2-alpine"
      port: 6379

  security:
    jwt:
      secret: "very_secret_key_that_is_at_least_32_chars_long_123"
      access-token-validity: 3600
      refresh-token-validity: 604800
      elevated-token-validity: 300
    refresh-token:
      store: redis

  email:
    sender: noreply@tissue.com
    provider: dummy
    verification:
      email-ttl: 1800s
      base-url: http://localhost:8080
      token:
        store: redis
