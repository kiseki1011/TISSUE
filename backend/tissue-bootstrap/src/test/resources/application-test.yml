spring:
  jpa:
    hibernate:
      ddl-auto: create

tissue:
  test:
    db:
      image: "postgres:16-alpine"
    redis:
      image: "redis:7.2-alpine"
      port: 6379

  use-redis: true

  security:
    jwt:
      secret: "very_secret_key_that_is_at_least_32_chars_long_123"
      access-token-validity: 1h
      refresh-token-validity: 7d
      elevated-token-validity: 5m

  email:
    sender: noreply@tissue.com
    verification:
      email-ttl: 1800s
      base-url: http://localhost:8080
