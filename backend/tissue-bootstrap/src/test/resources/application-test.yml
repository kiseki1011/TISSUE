spring:
  jpa:
    hibernate:
      ddl-auto: create

tissue:
  test:
    db:
      image: "postgres:16-alpine"
    redis:
      image: "redis:7.2-alpine"
      port: 6379

  use-redis: true

  base-url: http://localhost:8080

  security:
    jwt:
      secret: "PLACEHOLDER_SECRET_THAT_IS_OVER_32"

  email:
    client: dummy
    sender: noreply@trytissue.dev
    verification:
      email-ttl: 1800s

  attachment:
    storage-type: local # local | s3
    storage-path: ./tissue-storage
