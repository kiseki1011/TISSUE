services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tissue-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # DB
      POSTGRESQL_ENDPOINT_URL: jdbc:postgresql://postgres:5432/tissue
      POSTGRESQL_USERNAME: tissue
      POSTGRESQL_PASSWORD: tissue
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      # Mail
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      # Tissue
      TISSUE_BASE_URL: http://localhost:8080
      TISSUE_EMAIL_SENDER: noreply@trytissue.dev
      TISSUE_LOCAL_STORAGE_PATH: /var/tissue/storage
      JWT_SECRET: "loadtest-secret-at-least-32-bytes-long-do-not-use-in-real-production"
      OAUTH2_ALLOWED_REDIRECT_ORIGINS: "*"
      SIGNUP_ALLOWED_DOMAINS: "*"
      CORS_ALLOWED_ORIGINS: "*"
      TRUSTED_PROXY_IP: ""
      # Mailpit doesn't require SMTP auth; disable the mail health check
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "8080:8080" # API
      - "8081:8081" # actuator
    volumes:
      - tissue_storage:/var/tissue/storage
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"

  postgres:
    image: postgres:16-alpine
    container_name: tissue-loadtest-db
    environment:
      POSTGRES_DB: tissue
      POSTGRES_USER: tissue
      POSTGRES_PASSWORD: tissue
    ports:
      - "5432:5432"
    volumes:
      - postgres_loadtest_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tissue -d tissue"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tissue-loadtest-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: tissue-loadtest-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: tissue-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.2.0
    container_name: tissue-loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.2.0
    container_name: tissue-promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tissue-grafana
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  postgres_loadtest_data:
  tissue_storage:
  prometheus_data:
  loki_data:
  grafana_data:
