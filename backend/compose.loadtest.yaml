# For loadtest (Uses SPRING_PROFILES_ACTIVE=loadtest)
#
# App + RDB + cache(optional) + alloy (log shipper)
# Uses the Dockerfile in the directory
#
# Monitoring stack (Prometheus / Loki / Grafana) lives in compose.observability.yaml
# Run both together on a single host:
#   docker compose -f compose.loadtest.yaml -f compose.observability.yaml up -d --build
#
# Or only this file (alloy will push to the remote LOKI_ENDPOINT defined in .env):
#   docker compose -f compose.loadtest.yaml up -d --build
#
# Example scenarios:
#   1) Self-host everything (single host docker):
#     .env: COMPOSE_PROFILES=selfhost-db,selfhost-cache
#
#   2) Has external infra (example: RDS / ElastiCache / USE_REDIS=false):
#     .env: COMPOSE_PROFILES=                  # leave empty
#      use external endpoints for POSTGRES_URL, REDIS_HOST
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tissue-app
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres:5432/tissue}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-tissue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tissue}
      USE_REDIS: ${USE_REDIS:-false}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-loadtest-weak-secret-at-least-32-bytes-long-do-not-use-in-real-production}
      TISSUE_BASE_URL: ${TISSUE_BASE_URL:-http://localhost:8080}
      # Performance
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-20}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-10}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
      VIRTUAL_THREADS_ENABLED: ${VIRTUAL_THREADS_ENABLED:-true}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -Duser.timezone=UTC}
    ports:
      - "8080:8080" # API
      - "8081:8081" # Actuator
    volumes:
      - tissue_storage:/var/tissue/storage
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-2g}
          cpus: "${APP_CPU_LIMIT:-2}"

  postgres:
    profiles: ["selfhost-db"]
    image: postgres:16-alpine
    container_name: tissue-loadtest-db
    # Logs the EXPLAIN of any query slower than `log_min_duration`.
    # Output: stderr → Docker logs → Alloy → Loki
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=auto_explain"
      - "-c"
      - "auto_explain.log_min_duration=200ms"
      - "-c"
      - "auto_explain.log_analyze=true"
      - "-c"
      - "auto_explain.log_buffers=true"
      - "-c"
      - "auto_explain.log_nested_statements=true"
      - "-c"
      - "auto_explain.log_format=text"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tissue}
      POSTGRES_USER: ${POSTGRES_USERNAME:-tissue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tissue}
    ports:
      - "5432:5432"
    volumes:
      - postgres_loadtest_data:/var/lib/postgresql/data
      - ./loadtest/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-tissue} -d ${POSTGRES_DB:-tissue}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    profiles: ["selfhost-cache"]
    image: redis:7-alpine
    container_name: tissue-loadtest-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Alloy pushes to Loki at LOKI_ENDPOINT
  # (default: same-host loki:3100, override for remote monitoring host)
  alloy:
    image: grafana/alloy:v1.5.0
    container_name: tissue-alloy
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    environment:
      LOKI_ENDPOINT: ${LOKI_ENDPOINT:-http://loki:3100/loki/api/v1/push}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "12345:12345" # Alloy web UI

volumes:
  postgres_loadtest_data:
  tissue_storage:
  alloy_data:
