global:
  scrape_interval: 5s
  evaluation_interval: 10s
  external_labels:
    environment: loadtest

scrape_configs:
  - job_name: tissue-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8081
        labels:
          application: tissue

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
