plugins {
  id 'java-library'
  id 'org.springframework.boot' version '3.3.3'
  id 'io.spring.dependency-management' version '1.1.6'
  id 'checkstyle'
  id 'com.diffplug.spotless' version '8.1.0'
  id "net.ltgt.errorprone" version '4.3.0'
  id 'idea'
}

import net.ltgt.gradle.errorprone.CheckSeverity

group = 'com.tissue'
version = '0.0.1-SNAPSHOT'

def javaVersion = JavaLanguageVersion.of(21)

java {
  toolchain {
    languageVersion = javaVersion
  }
}

repositories {
  mavenCentral()
}

sourceSets {
  integrationTest {
    compileClasspath += main.output + test.output
    runtimeClasspath += main.output + test.output
  }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
  integrationTestCompileOnly.extendsFrom testCompileOnly
  integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}

idea {
  module {
    testSourceDirs += file('src/integrationTest/java')
    testResourceDirs += file('src/integrationTest/resources')
  }
}

checkstyle {
  maxWarnings = 0
  configFile = file("${rootDir}/config/checkstyle/google_checks.xml") as File
  configProperties = [
    'org.checkstyle.google.severity'                : 'warning',
    'org.checkstyle.google.suppressionfilter.config': "${rootDir}/config/checkstyle/checkstyle-suppressions.xml"
  ]
  toolVersion = "12.3.0"
}

spotless {
  java {
    toggleOffOn()
    //  googleJavaFormat('1.24.0').aosp().reflowLongStrings()
    palantirJavaFormat('2.83.0')
    removeUnusedImports()
    trimTrailingWhitespace()
    endWithNewline()
  }
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-aop'
  implementation 'org.springframework.boot:spring-boot-starter-mail'
  implementation 'org.springframework.retry:spring-retry'
  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'com.github.ben-manes.caffeine:caffeine'
  implementation 'org.springframework.boot:spring-boot-starter-security'

  implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
  runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
  runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
  runtimeOnly 'org.postgresql:postgresql'

  implementation 'org.openapitools:jackson-databind-nullable:0.2.7'
  api "org.jspecify:jspecify:1.0.0"

  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'

  errorprone 'com.uber.nullaway:nullaway:0.12.15'
  errorprone 'com.google.errorprone:error_prone_core:2.45.0'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.security:spring-security-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
  integrationTestImplementation 'org.testcontainers:postgresql'
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.errorprone {
    check("NullAway", CheckSeverity.ERROR)
    option("NullAway:AnnotatedPackages", "com.tissue")
    option("NullAway:ExcludedFieldAnnotations",
      "jakarta.persistence.Id," +
      "jakarta.persistence.Column," +
      "jakarta.persistence.OneToOne," +
      "jakarta.persistence.OneToMany," +
      "jakarta.persistence.ManyToOne," +
      "jakarta.persistence.ManyToMany," +
      "jakarta.persistence.Version," +
      "org.springframework.data.annotation.CreatedDate," +
      "org.springframework.data.annotation.LastModifiedDate," +
      "org.springframework.data.annotation.CreatedBy," +
      "org.springframework.data.annotation.LastModifiedBy," +
      "org.springframework.beans.factory.annotation.Autowired," +
      "org.springframework.beans.factory.annotation.Value"
    )
  }
}

tasks.named('compileTestJava') {
  options.errorprone { disable("NullAway") }
}
tasks.named('compileIntegrationTestJava') {
  options.errorprone { disable("NullAway") }
}

tasks.withType(Checkstyle).configureEach {
  reports {
    xml.required = true
    html.required = true
  }
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = javaVersion
  }
}

tasks.named('compileJava') {
  dependsOn 'spotlessApply'
}

test {
  useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
  description = 'Runs integration tests'
  group = 'verification'
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  useJUnitPlatform()
  shouldRunAfter test
}

check.dependsOn integrationTest
