plugins {
  id 'java-library'
  id 'org.springframework.boot' version '3.3.3'
  id 'io.spring.dependency-management' version '1.1.6'
  id 'checkstyle'
  id 'com.diffplug.spotless' version '8.1.0'
  id "net.ltgt.errorprone" version '4.3.0'
}

group = 'com.tissue'
version = '0.0.1-SNAPSHOT'

def javaVersion = JavaLanguageVersion.of(21)

java {
  toolchain {
    languageVersion = javaVersion
  }
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
  mavenCentral()
}

checkstyle {
  maxWarnings = 0
  configFile = file("${rootDir}/config/checkstyle/google_checks.xml") as File
  configProperties = [
    'org.checkstyle.google.severity'                : 'warning',
    'org.checkstyle.google.suppressionfilter.config': "${rootDir}/config/checkstyle/checkstyle-suppressions.xml"
  ]
  toolVersion = "12.3.0"
}

spotless {
  java {
    toggleOffOn()
    googleJavaFormat('1.24.0').aosp().reflowLongStrings()

    removeUnusedImports()
    trimTrailingWhitespace()
    endWithNewline()
  }
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-aop'
  implementation 'org.springframework.boot:spring-boot-starter-mail'
  implementation 'org.springframework.retry:spring-retry'

  api "org.jspecify:jspecify:1.0.0"

  errorprone 'com.uber.nullaway:nullaway:0.12.15'
  errorprone 'com.google.errorprone:error_prone_core:2.45.0'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'

  implementation 'org.openapitools:jackson-databind-nullable:0.2.7'

  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'com.github.ben-manes.caffeine:caffeine'

  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  implementation 'org.springframework.boot:spring-boot-starter-security'
  testImplementation 'org.springframework.security:spring-security-test'

  implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
  runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
  runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

  runtimeOnly 'com.h2database:h2'
  runtimeOnly 'com.mysql:mysql-connector-j'

  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
}

import net.ltgt.gradle.errorprone.CheckSeverity

tasks.withType(JavaCompile) {
  options.errorprone {
    check("NullAway", CheckSeverity.ERROR)
    option("NullAway:AnnotatedPackages", "com.tissue")
  }
}

tasks.named('compileTestJava') {
  options.errorprone{
    disable("NullAway")
  }
}

tasks.withType(Checkstyle).configureEach {
  reports {
    xml.required = true
    html.required = true
  }

  javaLauncher = javaToolchains.launcherFor {
    languageVersion = javaVersion
  }
}

tasks.named('compileJava') {
  dependsOn 'spotlessApply'
}

test {
  useJUnitPlatform()
  exclude '**/deprecated/**'
}
