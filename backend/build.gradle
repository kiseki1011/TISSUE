plugins {
  id 'java'
  id 'org.springframework.boot' version '3.3.3'
  id 'io.spring.dependency-management' version '1.1.6'
  id 'jacoco'
  id 'checkstyle'
}

group = 'com.tissue'
version = '0.0.1-SNAPSHOT'

def javaVersion = JavaLanguageVersion.of(21)

java {
  toolchain {
    languageVersion = javaVersion
  }
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
  mavenCentral()
}

checkstyle {
  maxWarnings = 0
  configFile = file("${rootDir}/config/checkstyle/google_checks.xml") as File
  configProperties = [
    'org.checkstyle.google.severity'                : 'warning',
    'org.checkstyle.google.suppressionfilter.config': "${rootDir}/config/checkstyle/checkstyle-suppressions.xml"
  ]
  toolVersion = "12.3.0"
}

tasks.withType(Checkstyle) {
  reports {
    xml.required = true
    html.required = true
  }
}

tasks.withType(Checkstyle).configureEach {
  reports {
    xml.required = true
    html.required = true
  }

  javaLauncher = javaToolchains.launcherFor {
    languageVersion = javaVersion
  }
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-aop'
  implementation 'org.springframework.boot:spring-boot-starter-mail'
  implementation 'org.springframework.retry:spring-retry'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'

  implementation 'org.openapitools:jackson-databind-nullable:0.2.7'

  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'com.github.ben-manes.caffeine:caffeine'

  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  implementation 'org.springframework.boot:spring-boot-starter-security'
  testImplementation 'org.springframework.security:spring-security-test'

  implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
  runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
  runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

  runtimeOnly 'com.h2database:h2'
  runtimeOnly 'com.mysql:mysql-connector-j'

  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
}

test {
  useJUnitPlatform()
  exclude '**/deprecated/**'
}

ext.jacocoExcludesClass = [
  "com.tissue.api.**.domain.**",
  "com.tissue.api.**.dto.**",
  "**.*Application*",
  "**.*Request*",
  "**.*Response*",
  "**.*Exception*",
  "**.*Key*",
  "**.*Base62Encoder*",
  "**.*WorkspaceCodeGenerator*",
  "**.*Attributes*",
  "**.CheckCodeDuplicationService",
  "**.*Controller*",
  "**.Team*",
  "**.Message*",
  "**.*Checker*",
  "**.*Condition*",
  "**.*Reader*",
  "**.*Handler*",
  "**.*Entity*",
  "**.RandomNicknameGenerator*",
  "**.*Client*",
  "**.*Repository*",
  "**.*Initializer*",
  "**.*Token*",
  "**.*Dto*",
  "**.*PermissionType*",
  "**.*MaskingUtil*",
  "**.*AuthenticationEntryPoint*",
  "**.*AuditorProvider*"
]

ext.jacocoExcludesPath = jacocoExcludesClass.collect { it.replace('.', '/') }
  .collect { it.replace('**/*', '**/*') }
  .collect { it.replace('/**/', '/**/') }

jacoco {
  toolVersion = "0.8.10"
}

def jacocoEnabled = !project.hasProperty('skipJacoco')

jacocoTestReport {
  enabled = jacocoEnabled
  dependsOn tasks.test

  reports {
    xml.required = true;
    html.required = true
  }

  classDirectories.setFrom(
    files(sourceSets.main.output).asFileTree.matching {
      exclude jacocoExcludesPath
    }
  )
  sourceDirectories.setFrom files(sourceSets.main.allSource)

  executionData.setFrom(
    fileTree(
      dir: layout.buildDirectory.asFile.get(),
      includes: ['jacoco/*.exec', 'outputs/unit_test_code_coverage/*coverage.ec']
    )
  )
}

jacocoTestCoverageVerification {
  enabled = jacocoEnabled
  dependsOn tasks.test
  classDirectories.setFrom(
    files(sourceSets.main.output).asFileTree.matching {
      exclude jacocoExcludesPath
    }
  )
  violationRules {
    rule {
      enabled = true
      element = 'CLASS'
      limit {
        counter = 'LINE'
        value = 'COVEREDRATIO'
        minimum = 0.60
      }
      excludes = jacocoExcludesClass
    }
  }
}

check {
  if (jacocoEnabled) {
    dependsOn jacocoTestReport, jacocoTestCoverageVerification
  }
}
