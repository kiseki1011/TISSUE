# For local development
#
# You mostly won't need to run `docker compose up -d` yourself,
# since `spring-boot-docker-compose` auto-starts compose.yaml on boot and stops it on exit.
# (You still can, to keep infra up independently of the app.)
#
# See `.env.local.example` for details.
#
# Example:
#   docker compose up -d                   : postgres + mailpit
#   docker compose --profile redis up -d   : + redis (set `USE_REDIS=true` in .env)
services:
  postgres:
    image: postgres:16-alpine
    container_name: tissue-local-db
    environment:
      POSTGRES_DB: tissue_local
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tissue-local-redis
    profiles: ["redis"]
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: tissue-local-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres_data:
