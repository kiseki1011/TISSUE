# Overlay for Mode 2 (separate monitoring host): publishes the actuator/metrics port
# so a Prometheus running on ANOTHER machine can scrape app:8081.
#
#   COMPOSE_PROFILES=selfhost-db,observability \
#     docker compose -f compose.prod.yaml -f compose.metrics.yaml up -d --build
#
# Single-host deploys do NOT need this — an in-network Prometheus reaches app:8081
# directly over the docker network. Firewall 8081 so only the monitoring host can reach it.
services:
  app:
    ports:
      - "8081:8081"   # actuator: /actuator/health, /actuator/prometheus
